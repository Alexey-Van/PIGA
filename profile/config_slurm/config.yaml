# Singularity
use-singularity: true
singularity-args: "--nv -B /$(pwd | cut -d'/' -f2):/$(pwd | cut -d'/' -f2)"

# Slurm Settings for Snakemake V7
cluster: "sbatch --qos=Normal --requeue --parsable --cpus-per-task={threads} --mem={resources.mem_mb} --time={resources.time} {resources.gres} --output=logs_slurm/snakejob.{rule}.%j.out"
cluster-cancel: "scancel"
local-cores: 4

default-resources:
  - mem_mb=10000
  - time="7-00:00:00"
  - gres=""
