Draft_Assembly: true

samples: test_data/samples.list

sr_fastqs:
  - test_data/{sample}/{sample}.sr.R1.fastq.gz
  - test_data/{sample}/{sample}.sr.R2.fastq.gz

lr_fastqs:
  - test_data/{sample}/{sample}.ont.fastq.gz

# R10.4.1, 400 bps, SUP basecalling model.
medaka_model: r1041_e82_400bps_sup_g615

reference:
  CHM13: test_data/reference/chm13v2.0.fasta

par_region: test_data/reference/chm13v2.0_chrX_PAR.bed

prefix: test
